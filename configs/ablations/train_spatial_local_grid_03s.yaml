dataset: data/wit_vz/processed/horizon_sweep_v4_defaults/future_03s
visual_feature_cache: data/wit_vz/feature_cache/wit_vz_v4_defaults_001_dinov3_convnext_tiny
model: cue_memory_path_predictor
backbone: cached_dinov3_convnext_tiny
epochs: 80
batch_size: 512
hidden_dim: 128
freeze_backbone: true
temporal_type: timesformer
temporal_layers: 1
num_cue_tokens: 8
num_modes: 1
selector_layers: 1
selector_type: tokenlearner
tokenlearner_pooling: sigmoid
use_spatial_graph: true
spatial_graph_neighbors: 8
spatial_relation_type: local_grid
use_temporal_difference_conv: true
use_temporal_shift: true
memory_type: attention
decoder_layers: 1
loss: huber
trajectory_scale: auto
use_constant_velocity_residual: true
residual_scale: auto
balance_key: source_policy
balance_mode: both
balance_exponent: 0.5
lr: 0.0005
weight_decay: 0.001
dropout: 0.2
grad_clip_norm: 1.0
early_stopping_patience: 14
early_stopping_min_delta: 0.01
lr_scheduler_patience: 6
lr_scheduler_factor: 0.5
min_lr: 0.000001
mixed_precision: true
data_parallel: false
output_dir: runs/spatial_relation_ablation_v4_03s/local_grid
