dataset: data/wit_vz/processed/horizon_sweep_v4_defaults/future_03s
model: khaleque_motivated_baseline
backbone: small_cnn
epochs: 80
batch_size: 512
hidden_dim: 128
num_motivation_tokens: 4
num_heads: 4
freeze_backbone: true
loss: huber
trajectory_scale: auto
balance_key: source_policy
balance_mode: both
balance_exponent: 0.5
lr: 0.0005
weight_decay: 0.001
dropout: 0.2
grad_clip_norm: 1.0
early_stopping_patience: 14
early_stopping_min_delta: 0.01
lr_scheduler_patience: 6
lr_scheduler_factor: 0.5
min_lr: 0.000001
mixed_precision: true
data_parallel: false
output_dir: runs/paper_trainable_baselines_v4_03s/khaleque_motivated
