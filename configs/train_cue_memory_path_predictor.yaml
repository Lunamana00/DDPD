dataset: data/wit_vz/processed/wit_vz_mini_001
model: cue_memory_path_predictor
backbone: dinov2
fallback_backbone_for_offline_smoke_tests: small_cnn
epochs: 5
batch_size: 4
history_frames: 5
future_steps: 5
hidden_dim: 128
freeze_backbone: false
use_bottleneck_adapters: true
adapter_bottleneck_dim: 64
temporal_type: transformer
temporal_layers: 1
num_cue_tokens: 8
num_modes: 1
selector_layers: 1
memory_update: gru_cell
loss: huber
trajectory_scale: auto
use_constant_velocity_residual: true
residual_scale: auto
lr: 0.001
weight_decay: 0.001
dropout: 0.2
grad_clip_norm: 1.0
early_stopping_patience: 100
early_stopping_min_delta: 0.0
lr_scheduler_patience: 25
lr_scheduler_factor: 0.5
min_lr: 0.000001
output_dir: runs/cue_memory_mini
