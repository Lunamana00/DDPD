dataset: data/wit_vz/processed/wit_vz_expanded_001
visual_feature_cache: data/wit_vz/feature_cache/wit_vz_expanded_001_dinov3_convnext_tiny
model: cue_memory_path_predictor
backbone: cached_dinov3_convnext_tiny
epochs: 30
batch_size: 64
history_frames: 5
future_steps: 5
hidden_dim: 128
freeze_backbone: true
use_bottleneck_adapters: true
adapter_bottleneck_dim: 64
temporal_type: strnet
temporal_layers: 2
num_cue_tokens: 8
num_modes: 1
selector_layers: 1
selector_type: tokenlearner
tokenlearner_pooling: sigmoid
cue_temporal_layers: 2
use_spatial_graph: true
spatial_graph_neighbors: 8
use_temporal_difference_conv: true
use_temporal_shift: true
memory_type: attention
decoder_layers: 1
loss: huber
trajectory_scale: auto
use_constant_velocity_residual: true
residual_scale: auto
lr: 0.0005
weight_decay: 0.001
dropout: 0.2
grad_clip_norm: 1.0
early_stopping_patience: 8
early_stopping_min_delta: 0.01
lr_scheduler_patience: 4
lr_scheduler_factor: 0.5
min_lr: 0.000001
output_dir: runs/cue_memory_strnet_tokenlearner_dinov3_cached
