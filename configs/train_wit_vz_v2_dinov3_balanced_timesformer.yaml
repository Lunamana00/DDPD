dataset: data/wit_vz/processed/wit_vz_v2_multi_source_001
visual_feature_cache: data/wit_vz/feature_cache/wit_vz_v2_multi_source_001_dinov3_convnext_tiny
model: cue_memory_path_predictor
backbone: cached_dinov3_convnext_tiny
epochs: 60
batch_size: 192
hidden_dim: 128
freeze_backbone: true
temporal_type: timesformer
temporal_layers: 1
num_cue_tokens: 8
num_modes: 1
selector_layers: 1
selector_type: tokenlearner
tokenlearner_pooling: sigmoid
use_spatial_graph: true
spatial_graph_neighbors: 8
use_temporal_difference_conv: true
use_temporal_shift: true
memory_type: attention
decoder_layers: 1
loss: huber
trajectory_scale: auto
use_constant_velocity_residual: true
residual_scale: auto
balance_key: source
balance_mode: both
balance_exponent: 0.5
lr: 0.0005
weight_decay: 0.001
dropout: 0.2
grad_clip_norm: 1.0
early_stopping_patience: 12
early_stopping_min_delta: 0.01
lr_scheduler_patience: 5
lr_scheduler_factor: 0.5
min_lr: 0.000001
output_dir: runs/wit_vz_v2_dinov3_timesformer_balanced_dp
data_parallel: true
