# Diverse ViZDoom collection plan for the next WIT-VZ revision.
# my_way_home is intentionally smaller; training can also use --balance-*.
runs:
  - scenario: deadly_corridor
    map: map01
    run_id: wit_vz_v3_deadly_corridor_mixed_001
    episodes: 80
    max_steps: 600
    frame_skip: 4
    mode: scripted
    policy: mixed
    policy_mix: [corridor, random_walk, noisy_corridor, goal_directed, obstacle_avoidance]
    policy_noise: 0.08
    start_random_steps: 5
    start_random_jitter: 20
    save_rgb: true
    seed: 301
