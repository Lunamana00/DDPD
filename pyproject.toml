[project]
name = "wit-route-critic"
version = "0.1.0"
description = "ViZDoom egocentric future path prediction research prototype."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "torch>=2.0",
]

[project.optional-dependencies]
dinov2 = [
    "transformers>=4.56",
]
dinov3 = [
    "timm>=1.0",
    "transformers>=4.56",
    "torchvision>=0.26",
]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
vizdoom = [
    "vizdoom>=1.2",
]
ai2thor = [
    "ai2thor>=5.0",
]
miniworld = [
    "gymnasium>=1.0",
    "miniworld>=2.1",
]
external-demo = [
    "ai2thor>=5.0",
    "gymnasium>=1.0",
    "miniworld>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
